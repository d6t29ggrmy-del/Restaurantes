name: restaurantes-diario

# Roda 1x por dia. GitHub usa UTC: 13:00 UTC ~ 07:00-08:00 no Horario Central.
# O agendador do GitHub as vezes atrasa alguns minutos — normal.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}          # botao "Run workflow" para rodar na hora

permissions:
  contents: write                # necessario para o robo salvar o estado no repo

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar robo
        env:
          EMAIL_ORIGEM: ${{ secrets.EMAIL_ORIGEM }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python monitor.py

      - name: Salvar estado (ja_vistos, saude, digest)
        run: |
          git config user.name "restaurant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ja_vistos.json saude_fontes.json digests/
          git commit -m "rodada diaria: $(date -u +%F)" || echo "nada novo a salvar"
          git push
